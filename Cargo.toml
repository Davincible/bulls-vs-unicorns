# ER fork workspace.
#
# Scoped to the ER program ONLY — deliberately not `programs/*`. The repo also contains
# programs/vault (Anchor 0.30.1), which is written but dormant: its declare_id! is a placeholder
# marked "replaced at deploy" and no engine code references it. Pulling it into this workspace makes
# cargo resolve one dependency graph across both, and anchor 0.30.1's solana-program 1.17 pins
# zeroize <1.4 while ephemeral-rollups-sdk 0.16.2 needs curve25519-dalek 4.x with zeroize ^1 — an
# unsatisfiable conflict that has nothing to do with either program's correctness.
#
# Upgrading the vault to anchor 1.x is a separate piece of work with its own risk. It is not a
# prerequisite for the ER migration, so it does not get to block it.
#
# programs/bulls-arena-session-spike is Phase 0 of snug-floating-mitten.md — a throwaway fork that
# adds session-keys 3.1.1 to `enter` only, deployed under its own fresh devnet keypair, to answer one
# question (does a session key authorize an action on an ER-delegated account) before any UI gets
# built on the assumption that it does. It shares this workspace's dependency graph deliberately —
# session-keys pins anchor-lang to a wide range for exactly this reason (see its own Cargo.toml).
[workspace]
members = ["programs/bulls-arena", "programs/bulls-arena-session-spike"]
resolver = "2"

[profile.release]
# SIZE MATTERS HERE FOR A CONCRETE REASON: program-data rent on Solana is proportional to the
# binary, and the devnet payer is capped by a rate-limited faucet. At 331 KB the upgrade needs
# ~2.31 SOL; the payer holds 0.88, so the binary has to come in under ~122 KB to deploy at all.
#
# overflow-checks stays ON despite the size cost. This program moves value, and a silent wrap in
# stake arithmetic is exactly the class of bug that has already bitten this codebase repeatedly.
# Paying bytes for that is not a trade worth making.
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"      # optimise for size, not speed — the hot path is the ER, not the BPF loader
panic = "abort"      # unwinding tables are dead weight; a Solana program aborts anyway
strip = true
