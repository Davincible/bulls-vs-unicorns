<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARENA — paper themes</title>
<style>
  :root { --pg:#0e0e0e; --fg:#f2f2f2; --dim:#8c8c8c; --line:#2a2a2a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--pg); color:var(--fg);
         font:400 13px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:-0.005em; }
  .mono { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }
  .u { font:400 10px/1.2 "SF Mono",ui-monospace,Menlo,Consolas,monospace;
       letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  header { position:sticky; top:0; z-index:5; background:var(--pg); border-bottom:1px solid var(--line);
           padding:14px 22px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  h1 { font-size:15px; font-weight:500; margin:0; text-transform:uppercase; letter-spacing:-.01em; }
  .keys { margin-left:auto; }
  .strip { display:flex; gap:6px; padding:12px 22px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .sw { width:96px; height:34px; border:1px solid #444; color:#0b0b0b; cursor:pointer; padding:0;
        font:400 9.5px/1 "SF Mono",ui-monospace,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; }
  .sw[aria-pressed="true"] { border:3px solid var(--fg); }
  main { padding:22px; }
  figure { margin:0 0 34px; }
  figcaption { display:flex; gap:20px; align-items:baseline; flex-wrap:wrap; padding:0 0 10px; }
  .rank { font:400 9.5px/1 "SF Mono",ui-monospace,Menlo,monospace; letter-spacing:.14em;
          text-transform:uppercase; padding:4px 6px; border:1px solid currentColor; }
  .rank-pick { color:#6fdc8c; } .rank-ok { color:#c7c7c7; } .rank-keep { color:#c7c7c7; }
  .rank-watch { color:#e6c15a; } .rank-avoid { color:#ff6b5e; }
  .nums { display:flex; gap:14px; flex-wrap:wrap; margin-left:auto; }
  .nums span { display:flex; gap:5px; align-items:baseline; }
  .bad { color:#ff6b5e; }
  .note { color:#b9b9b9; max-width:88ch; margin:0 0 12px; font-size:12.5px; }
  img { display:block; width:100%; height:auto; border:1px solid var(--line); }
  .chip { width:11px; height:11px; display:inline-block; border:1px solid #555; vertical-align:-1px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Arena — paper themes</h1>
  <span class="u">1440×900 · fixture round 17, ~11s into the fight · strength 70%</span>
  <span class="u">Magenta/Pink/Rose are the hot originals with white type (under AA); Plum/Berry/Wine are the same hues over ink</span>
  <span class="u keys">← → theme · B board · showing <b id="boardName" style="color:var(--fg);font-weight:400">blank</b></span>
</header>

<div class="strip" id="strip"></div>

<main id="sheets"></main>

<script>
const DATA = [{"id":"white","name":"White","hue":"#ffffff","paper":"#ffffff","panel":"#ffffff","a":"#2b8c39","b":"#8f09bf","ink":19.682627652657427,"label":3.4522201871078138,"ca":4.274345222823251,"cb":7.0962238771874375,"sides":1.6601896915804815,"rank":"keep","note":"The page that shipped, byte for byte. The bar everything else has to beat.","polarity":"dark"},{"id":"lime","name":"Lime","hue":"#afff00","paper":"#c7ff4d","panel":"#d9ff86","a":"#267f33","b":"#8f09bf","ink":16.72047389035713,"label":3.4794564711032634,"ca":4.282221187331769,"cb":6.028271638955772,"sides":1.4077441064439642,"rank":"pick","note":"The loudest of the dark-type sheets and the one that costs least: ANSEM green barely has to move, UWU violet does not move at all, and the two sides stay 1.41 apart. Green paper under green fighters is the closest call here — the rim and the enemy wedge carry it.","polarity":"dark"},{"id":"mint","name":"Mint","hue":"#27ff5d","paper":"#68ff8e","panel":"#98ffb2","a":"#247830","b":"#8f09bf","ink":15.261731435952095,"label":3.4710304046468923,"ca":4.280232142502772,"cb":5.502347803058871,"sides":1.2855255555932286,"rank":"ok","note":"Softer than Lime and slightly worse at the same job: being a mid-green it sits nearer the ANSEM discs, so the field reads a shade flatter. A good second choice if Lime is too aggressive.","polarity":"dark"},{"id":"cyan","name":"Cyan","hue":"#00f3ff","paper":"#4df7ff","panel":"#86f9ff","a":"#23772f","b":"#8f09bf","ink":15.056143366131419,"label":3.462026461033382,"ca":4.282277639776275,"cb":5.428226654415926,"sides":1.2676026897451518,"rank":"pick","note":"The safest strong colour on the list. Its hue is far from both sides, so nothing on the field argues with the sheet — violet is completely untouched, green stays green, type at 15:1. Playful without giving anything up.","polarity":"dark"},{"id":"sky","name":"Sky","hue":"#00cfff","paper":"#4dddff","panel":"#86e8ff","a":"#1d6828","b":"#8d09bd","ink":12.280213203383644,"label":3.46847240244454,"ca":4.277538848067234,"cb":4.507961918983142,"sides":1.0538681421958385,"rank":"watch","note":"Lovely at 70 and the point where the cost starts: the violet has begun to darken and the two sides are down to 1.05 apart in lightness. Below about 40% it behaves like Cyan.","polarity":"dark"},{"id":"sun","name":"Sun","hue":"#fff127","paper":"#fff568","panel":"#fff898","a":"#278234","b":"#8f09bf","ink":17.35150943005376,"label":3.457461461970952,"ca":4.276567072467522,"cb":6.25578036102137,"sides":1.462804220070812,"rank":"pick","note":"The quietest way to make the page playful and the strongest on the numbers after white: type at 17.4:1, violet untouched, sides 1.46 apart. Reads as coloured paper rather than a coloured screen, which is the register this design is written in.","polarity":"dark"},{"id":"magenta","name":"Magenta","hue":"#ff00fb","paper":"#ff4dfc","panel":"#b138af","a":"#0f4117","b":"#590379","ink":2.720487097057319,"label":2.720487097057319,"ca":4.315292005653681,"cb":4.5039108739513525,"sides":1.0437094101744568,"rank":"under aa","note":"Your hex exactly (#ff00fb over white) with the white type you asked for. It is the most electric thing in the set and the type is at 2.7:1 — under AA's 4.5, and there is no strength that fixes it, because hot pink over white is a LIGHT colour. Shipped as asked, with the switcher saying so in red. The fighters still work: they take their direction from the sheet rather than from the type, so they stay deep green and deep violet under white words.","polarity":"light"},{"id":"pink","name":"Pink","hue":"#ff00a7","paper":"#ff4dc1","panel":"#b13887","a":"#0d3b14","b":"#50036c","ink":2.9645934330915127,"label":2.9645934330915127,"ca":4.285818372227471,"cb":4.509948023913917,"sides":1.0522956486301025,"rank":"under aa","note":"Same trade as Magenta, a touch more forgiving at 3.0:1 — still under AA. Warmer and slightly less electric.","polarity":"light"},{"id":"rose","name":"Rose","hue":"#ff0078","paper":"#ff4da1","panel":"#b13871","a":"#0c3812","b":"#4c0268","ink":3.075484385489924,"label":3.075484385489924,"ca":4.294362572063161,"cb":4.50444601281609,"sides":1.0489207506882676,"rank":"under aa","note":"The most legible of the three hot sheets at 3.1:1, and still under AA. If one of these three is going to ship, this is the one to argue for.","polarity":"light"},{"id":"plum","name":"Plum","hue":"#ff00fb","paper":"#620761","panel":"#460845","a":"#60a96a","b":"#dfb9ed","ink":12.192720938632695,"label":3.695332212182879,"ca":4.285258120388599,"cb":7.141488427944992,"sides":1.6665246823678805,"rank":"pick","note":"The same #ff00fb, laid over ink instead of white. White type at 12:1, hairlines and labels all lighter than the page, and it gets richer as the slider goes up (#870585 at 100). The two sides invert to a pale green and a pale lilac and stay 1.67 apart — the same spacing they have on the white page, so the field reads exactly as it should.","polarity":"light"},{"id":"berry","name":"Berry","hue":"#ff00a7","paper":"#680747","panel":"#4b0834","a":"#60a96a","b":"#deb8ec","ink":12.280779012566093,"label":3.7160495478444133,"ca":4.316207042970206,"cb":7.118957498047674,"sides":1.649354960773325,"rank":"ok","note":"#ff00a7 over ink. Nothing separates it from Plum on the numbers; pick between them by eye. Best at full strength (#900560).","polarity":"light"},{"id":"wine","name":"Wine","hue":"#ff0078","paper":"#6b0736","panel":"#4d0828","a":"#60a86a","b":"#deb8ec","ink":12.289183063391075,"label":3.697135738928225,"ca":4.27577751902717,"cb":7.123829182537172,"sides":1.6660897698339538,"rank":"ok","note":"#ff0078 over ink, and the reddest of the three. At 100% (#950548) it is the most wine-like thing here and the furthest from the page's usual register.","polarity":"light"},{"id":"black","name":"Black","hue":"#0b0b0b","paper":"#0b0b0b","panel":"#1f1f1f","a":"#2b8c39","b":"#c681de","ink":19.682627652657427,"label":4.983650696467777,"ca":4.604828722668507,"cb":7.119526397640718,"sides":1.5461001540823736,"rank":"pick","note":"White type on #0b0b0b at 19.7:1 — the exact mirror of the white page, and the only sheet besides white where nothing has to be compromised. Panels step to #1f1f1f. ANSEM green needs no adjustment at all against black, UWU violet lifts to a light lilac, and the two sides come out 1.55 apart against white's 1.66 — the best two-colour separation of any coloured sheet here.","polarity":"light"}];
let board = "blank";
let idx = 0;

const strip = document.getElementById("strip");
const sheets = document.getElementById("sheets");

DATA.forEach((d, i) => {
  const b = document.createElement("button");
  b.className = "sw"; b.style.background = d.paper; b.textContent = d.name;
  b.setAttribute("aria-pressed", String(i === 0));
  b.onclick = () => select(i);
  strip.appendChild(b);

  const fig = document.createElement("figure");
  fig.id = "fig-" + i;
  const bad = (v, bar) => v < bar ? ' class="mono bad"' : ' class="mono"';
  fig.innerHTML =
    '<figcaption>' +
      '<span class="rank rank-' + d.rank + '">' + d.rank + '</span>' +
      '<b style="font-weight:500">' + d.name + '</b>' +
      '<span class="u">' + (d.polarity === 'light' ? 'light type' : 'dark type') + '</span>' +
      '<span class="u mono"><span class="chip" style="background:' + d.paper + '"></span> page ' + d.paper +
        ' <span class="chip" style="background:' + d.panel + '"></span> panel ' + d.panel + '</span>' +
      '<span class="u mono"><span class="chip" style="background:' + d.a + '"></span> a ' + d.a +
        ' <span class="chip" style="background:' + d.b + '"></span> b ' + d.b + '</span>' +
      '<span class="nums u">' +
        '<span>ink<b' + bad(d.ink, 4.5) + '>' + d.ink.toFixed(2) + '</b></span>' +
        '<span>label<b' + bad(d.label, 3.4) + '>' + d.label.toFixed(2) + '</b></span>' +
        '<span>a<b' + bad(d.ca, 4.2) + '>' + d.ca.toFixed(2) + '</b></span>' +
        '<span>b<b' + bad(d.cb, 4.2) + '>' + d.cb.toFixed(2) + '</b></span>' +
        '<span>a/b<b' + bad(d.sides, 1.2) + '>' + d.sides.toFixed(2) + '</b></span>' +
      '</span>' +
    '</figcaption>' +
    '<p class="note">' + d.note + '</p>' +
    '<img alt="' + d.name + '" data-theme="' + d.id + '" src="blank-' + d.id + '.png">';
  sheets.appendChild(fig);
});

function select(i) {
  idx = (i + DATA.length) % DATA.length;
  [...strip.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === idx)));
  document.getElementById("fig-" + idx).scrollIntoView({ behavior: "smooth", block: "start" });
}
function setBoard(b) {
  board = b;
  document.getElementById("boardName").textContent = b;
  sheets.querySelectorAll("img").forEach((img) => { img.src = b + "-" + img.dataset.theme + ".png"; });
}
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") select(idx + 1);
  else if (e.key === "ArrowLeft") select(idx - 1);
  else if (e.key.toLowerCase() === "b") setBoard(board === "blank" ? "survey" : "blank");
});
</script>
</body>
</html>
