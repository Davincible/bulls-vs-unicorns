# Fly.io config for the Bulls ⚔ Unicorns ROUND KEEPER — the process that opens, drives and settles
# rounds of the on-chain arena, and publishes the status file the front end reads to tell
# "next lobby in 0:08" from "keeper is down".
#
# Deploy from this directory, which is also the build context (unlike engine/, which builds from the
# repo root):
#   cd er-demo && fly deploy
#
# THREE RULES THIS FILE ENFORCES. The first one is not a preference — breaking it burns SOL that
# nothing can recover.
#
#  1. EXACTLY ONE MACHINE.
#     Two keepers both read arena.round_counter and both try to open `counter + 1`. The loser gets
#     RoundOutOfOrder and backs off — loud, not silent, and that part is survivable. What is not
#     survivable is what the winner leaves behind: the round the loser was driving is now BEHIND the
#     counter, unreachable by a phase machine that correctly follows the chain rather than its own
#     memory. It sits delegated, past its deadline, holding ~0.0085 SOL of round-PDA rent that NO
#     instruction ever reclaims — close_round undelegates an account, it does not close one. This is
#     not hypothetical; it happened today, and scripts/keeper/README.md writes it up under "Rounds
#     can be stranded in Lobby". Two keepers would also field house fighters into each other's
#     rounds, which quietly retires the "no house-versus-house fights" guarantee.
#     THE MOST LIKELY WAY TO GET TWO KEEPERS IS NOT SCALING — IT IS THE FIRST DEPLOY.
#     Fly Launch creates and starts TWO machines by default for a process group that has services
#     ("redundancy by default"), and does it again on any `fly deploy` that follows a scale-to-zero.
#     Nothing in this file can prevent that: `min_machines_running` is a floor, not a ceiling, and
#     Fly has no maximum-machine-count setting at all (staff answer, Jan 2025). The opt-out is a
#     FLAG ON THE COMMAND, and it has to be on every deploy:
#
#         fly deploy --ha=false
#
#     That is the single most important line in this file's whole story, because it is the one that
#     is easy to leave out and it fails by silently doing the expensive thing.
#
#     So: auto_stop_machines = "off", auto_start_machines = false, `--ha=false` on every deploy, and
#     NEVER `fly scale count 2`. There is no configuration of this app in which a second machine is
#     an improvement.
#
#     Deploy-time overlap deserves an honest answer rather than a rule. With `rolling` (the default,
#     and set explicitly below) a single-machine app is updated IN PLACE — the same machine is
#     stopped, re-imaged and restarted, so there is a window with zero keepers and never a window
#     with two. `canary` and `bluegreen` both boot a second machine alongside the running one and
#     must never be used here; `canary` is explicitly refused by Fly only when a volume is mounted,
#     and this app has none (rule 2), so nothing but this comment stops someone reaching for it.
#     Where overlap can still happen — a hand-run second instance, a deploy racing a manual start —
#     most of it is benign by construction: every action is re-derived from the chain each pass and
#     the process holds no local state, so a duplicate close_round or resolve costs one signature
#     and the program refuses the second. The genuinely unsafe window is open_round: both processes
#     read the same round_counter, both try `counter + 1`, and the loser's rent (if it had already
#     paid for a round PDA in a racing sequence) is gone. `enter` is not idempotent either — a
#     duplicate tops a house fighter up rather than failing. Nothing here CLOSES those windows; one
#     machine does.
#
#  2. NO VOLUME, and this is the reason nobody should add one out of habit.
#     The loop re-derives every decision from the chain on every pass — which is exactly why a crash
#     mid-fight is indistinguishable from a fresh boot, and why there is no reconciliation routine
#     in the codebase to rot. The only local state that ever persisted was the house-wallet key
#     file, and in production that arrives as a fly secret. There is genuinely nothing to keep. A
#     volume would additionally pin this app to one region forever and turn a region change into a
#     data migration, in exchange for storing nothing.
#
#  3. NO SCALE TO ZERO.
#     A stopped machine is not a cheaper arena, it is no arena: no round opens, /keeper-status.json
#     404s, and the page correctly renders "keeper is down, no round is coming". Being the thing
#     that is always there is the entire job.

app = "bulls-arena-keeper-devnet"

# Deliberately NOT engine's `bulls-arena-er-devnet`. Different service, different failure modes,
# separate secrets, separate restart blast radius. Two apps in one org do not collide; two services
# sharing one app do.

# Change with `fly regions list` for options, then set this and redeploy — with no volume (rule 2)
# a region change really is just a redeploy, which is that rule paying for itself.
# The latency that matters here is NOT to players: the browser talks to the chain directly and only
# polls this app for the status file. It is to the endpoints the keeper itself hammers. By count
# that is dominated by ER traffic through the MagicBlock Magic Router — up to one tick per second of
# fight, against a handful of base-layer calls per round — and the router is currently observed
# serving from devnet-eu.magicblock.app. So: Frankfurt.
# That is reasoning, not measurement. If ER round-trip times are ever actually sampled from two
# regions, believe the sample over this comment.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Non-secret configuration only. Anything carrying key material or an API key goes in
# `fly secrets`, which is read from the environment at boot and never appears in a diff:
#   fly secrets set KEEPER_OPERATOR_KEY="$(cat ../.devnet/fork-payer.json)"
#   fly secrets set KEEPER_HOUSE_WALLETS="$(cat ../.devnet/keeper-house-wallets.json)"
#   fly secrets set KEEPER_HOUSE_TOKEN="$(openssl rand -base64 32)"
#
# KEEPER_HOUSE_TOKEN IS THE ONE THAT IS NOT KEY MATERIAL, AND IT IS STILL A SECRET. It is the bearer
# credential on `GET /house-wallets.json`, the authenticated endpoint that serves the arena's own
# wallet list. That list used to be published to every browser inside /keeper-status.json; it is now
# internal, and this token is the whole of the boundary. The keeper enforces a 32-character minimum
# and refuses to enable the route below that, because a token short enough to guess is a list that is
# only nominally private.
#
# UNSET IS NOT "OPEN", IT IS "ABSENT": with no token the keeper does not serve the route at all, and
# answers as though the path were unknown — a 404 rather than a 401, so an anonymous caller is not
# even told there is a list here to attack.
#
# AND THE BLAST RADIUS OF FORGETTING IT REACHES A DIFFERENT APP ENTIRELY, which is the part worth
# knowing before you skip this line. The Vercel identity API reads the roster from this endpoint to
# keep a person's face off one of these wallets. It cannot make that check without the token, and it
# fails CLOSED rather than guessing — so it serves NO avatars at all, site-wide, for every player.
# That is the correct direction (the fallback is the ordinary rendering: a side coin and a pseudonym,
# what most players see anyway) and it is silent, because nothing on any screen distinguishes "no
# avatars" from "nobody has linked". So: the same value must be set on BOTH sides, under this same
# name, and `api/links.ts` throws at cold start when its copy is missing — which turns half of the
# mistake into a loud 500 on /api/links instead of a blank that nobody notices. The other half, a
# token set here and stale on Vercel, surfaces as a 401 that the API diagnoses as a wrong credential
# rather than as a keeper outage. Fly cannot read a secret back, by design; rotate by setting both
# sides, not by trying to recover the old value.
[env]
  KEEPER_HTTP_PORT = "8080"

  # HOLD OPEN, and the arithmetic is the whole argument.
  #
  # Every round permanently locks ~0.0098 SOL all-in, of which ~0.0085 is round-PDA rent that no
  # instruction ever reclaims (verified, not inferred: rounds #4-#18 all still hold exactly
  # 0.008498 SOL). The fixed cadence cycles a round about every 110 seconds, so an arena nobody is
  # playing in costs:
  #
  #     fixed cadence   ~0.32   SOL/hour
  #     1-hour holds    ~0.0098 SOL/hour   <- 97% of the saving, and where this sits
  #
  # A deployment that will sit idle most of the time must not run the fixed cadence. Hold-open opens
  # ONE lobby with a one-hour backstop and holds it until a real player arrives, so the fight starts
  # because a person showed up rather than because a timer fired.
  #
  # The safety rail: this policy needs the authority-signed early close in close_lobby_and_draw to
  # be DEPLOYED. Nothing in this process can determine that — the IDL is generated from source, so a
  # capability probe would only prove that somebody edited Rust. What the IDL CAN do is prove the
  # negative, and it does: if close_lobby_and_draw has no authority account, the keeper refuses to
  # boot rather than sending early closes that come back as LobbyStillOpen with a real player
  # standing in the lobby. If this deploy crash-loops at startup, that is the check firing, and the
  # fix is to deploy the program — not to set this to "0" and lose the 97%.
  KEEPER_HOLD_OPEN = "1"
  # THE BACKSTOP: 7 days, which is MAX_LOBBY_SECONDS — the longest the program will clamp to.
  #
  # The default is one hour, and one hour was never an optimum: it is the length that was MEASURED
  # (24 clean probes over 3,600s of continuous ER delegation) and the constant was set to the
  # experiment. The backstop only fires when NOBODY came — a real player's arrival closes the lobby
  # immediately either way — so lengthening it cannot make a single person wait. What it removes is
  # the abandon/open/delegate cycle that an empty arena performs on itself, measured at ~0.00041 SOL
  # once close_round_account is reclaiming rent:
  #
  #     1 hour    24 cycles/day   ~0.0098   SOL/day
  #     7 days     0.14/day       ~0.00006  SOL/day     <- here, ~170x less
  #
  # WHAT THIS DOES NOT TRADE AWAY. The obvious objection is that a wedged round would now linger for
  # a week. It would not: `wedgeAndMoveOn` opens the next round the moment it detects a round stuck
  # in Drawing without a VRF callback, and never consults this value. Wedge recovery is not gated on
  # the backstop.
  #
  # WHAT IT DOES TRADE AWAY, honestly: a round is delegated for the whole lobby, so if the ER
  # validator dies while a lobby is idle, `abandon_round` cannot undelegate it and that round can sit
  # until the backstop finally fires — up to a week now, rather than up to an hour. That strands one
  # round's ~0.0085 SOL for that long. It is a real cost and it is smaller than the one being
  # removed, but it is the reason this line names a trade rather than just a number.
  KEEPER_HOLD_OPEN_LOBBY_SECONDS = "604800"

  # Both URLs are run through assertDevnetUrl at boot, on every endpoint including the ER
  # validator's fqdn. A mainnet URL arriving here or through `fly secrets` fails the process loudly
  # instead of connecting: env indirection is not permitted to become the hole in the mainnet guard.
  #
  # They are overridable at all because api.devnet.solana.com rate-limits — 429s observed with just
  # one browser plus one sampler — so a paid Helius/QuickNode/Triton *devnet* endpoint drops in with
  # no code change. An endpoint whose URL carries an API key is a `fly secret`, not a line here;
  # this file is committed.
  KEEPER_BASE_RPC = "https://api.devnet.solana.com"
  KEEPER_ROUTER_URL = "https://devnet-router.magicblock.app"

  # THE HOUSE'S BOARD IS DELIBERATELY ABSENT FROM THIS FILE, and that absence is the feature.
  #
  # Five knobs decide how many house fighters a round holds and what they stake:
  #
  #     KEEPER_HOUSE_WALLET_COUNT   10     wallets banked, and the ceiling on the roster
  #     KEEPER_HOUSE_BOARD_TARGET   10     total fighters the board is held at, real players included
  #     KEEPER_HOUSE_DISPLACEMENT    1     house seats given up per real entrant
  #     KEEPER_HOUSE_STAKE_MIN_USD   5     floor of the stake band
  #     KEEPER_HOUSE_STAKE_MAX_USD  20     ceiling — the number that sets house exposure per round
  #
  # TWO OF THEM ARE NOW SET IN PRODUCTION AND DIFFER FROM THEIR DEFAULTS, so read this before trusting
  # the table above. `KEEPER_HOUSE_WALLET_COUNT` is set to **48** as a fly secret against a code
  # default of 10, with a pool file holding forty-eight funded keys to match, and
  # `KEEPER_HOUSE_BOARD_TARGET` is set to **48** beside it — a full room, at the program's own cap.
  #
  # A pool larger than the board would NOT put more fighters in a round; what it buys is that the CAST
  # CHANGES between rounds, because `plannedHouseEntries` rotates its starting point by round number.
  # At a pool and a board that are both 48 that rotation is currently a no-op — every wallet is needed
  # every round — and it is what makes raising the pool above the board a one-line secret change rather
  # than a code change.
  #
  # WHEN THEY ARRIVE IS ITS OWN PAIR OF KNOBS, AND NEITHER IS SET HERE BECAUSE THE DEFAULTS ARE THE
  # INTENDED PRODUCTION VALUES:
  #
  #     KEEPER_REAL_PLAYER_GRACE_SECONDS   45   entries stay open this long after the first real
  #                                             player arrives — and it is the whole window the house
  #                                             arrives across, because a room with nobody real in it
  #                                             holds exactly one house fighter and cannot fill early
  #     KEEPER_HOUSE_ARRIVAL_TAIL_SECONDS   5   the quiet between the last scheduled arrival and the
  #                                             draw: confirmation headroom, and a beat of stillness
  #                                             before the bell
  #
  # The house does not step up to its board any more — it arrives on a deterministic schedule spread
  # across that window, one or two fighters at a time, so forty-seven bots no longer materialise in a
  # single frame eight seconds after somebody walks in. Both are retunable with `fly secrets` and no
  # deploy, exactly like the five above. `KEEPER_HOUSE_FILL_LEAD_SECONDS`, which used to name the step,
  # is gone, and the keeper REFUSES TO BOOT if it is still set rather than ignoring it.
  #
  # The rest of the defaults ARE the intended production values, so nothing else needs to be written
  # here — and that is the point. An `[env]` line is only changeable by `fly deploy`, and the one number in this set that
  # will genuinely need retuning is the stake ceiling, once the house-edge measurement lands. Putting
  # these here would tie an economics decision to a code deploy. Retune them without one:
  #
  #     fly secrets set KEEPER_HOUSE_STAKE_MAX_USD=50     # restarts the machine, no image rebuild
  #
  # (`fly secrets` is the no-deploy path even for values that are not secret. That is a slightly odd
  # use of the word and it is the mechanism Fly actually provides.)
  #
  # WHAT DOES *NOT* HAVE A KNOB, on purpose: the count of house fighters allowed in a room with no real
  # player in it. That is fixed at ONE, in `houseSizing.ts`, because one is below the program's
  # `enough_to_fight` — so a house-only lobby cannot be drawn by us OR by a permissionless caller, and
  # `abandon_round` stays legal so the round still terminates. It is the operator's "no runs on only
  # house players" instruction expressed as something the chain enforces rather than something this
  # process promises, and a knob whose only safe value is 1 is a way to lose that by typo.
  #
  # THAT PARAGRAPH IS NOW CONDITIONAL, AND SAYING SO IS THE POINT. The COUNT still has no knob and
  # never will — but there is now a second EMPTY-ROOM POLICY, asked for by name rather than by number,
  # and under it the count above is simply not consulted. So "a room with nobody real in it holds one
  # fighter and cannot be drawn" is true of every deployment that has not set the line below, and false
  # of one that has. See KEEPER_HOUSE_ONLY_ROUNDS immediately after this.

  # KEEPER_HOUSE_ONLY_ROUNDS — DELIBERATELY NOT SET, AND NOT MERELY UNSET-BY-DEFAULT.
  #
  #     KEEPER_HOUSE_ONLY_ROUNDS = "1"     # <- do not uncomment without reading all of this
  #
  # It asks for an arena that keeps running with nobody real in it: an empty room is filled to the
  # board, drawn, and fought by this keeper's own wallets, all day. What it costs is not the fighters.
  #
  # IT RETIRES THE GUARANTEE THE PARAGRAPH ABOVE DOCUMENTS AT LENGTH. Not weakens — retires. The one
  # fighter is what puts an empty room below `enough_to_fight`; fill the room and the round is drawable
  # by us and by any permissionless caller, and `abandon_round` — which requires `lobby_is_dead`, which
  # requires FEWER THAN TWO fighters — is refused on it. "The house never fights itself" stops being
  # something the chain enforces and becomes nothing at all.
  #
  # AND THE ABANDON PATH GOING AWAY IS THE EXPENSIVE HALF. With `abandon_round` refused, the only
  # instruction that can end a house-only lobby is `close_lobby_and_draw`. If that cannot land — a dead
  # ER validator, a VRF queue that refuses, a delegation lost — the round sits in `Lobby` with nothing
  # left that will succeed on it, and its ~0.0235 SOL is stranded PERMANENTLY (`close_round_account`
  # needs `house_swept`; sweeping needs a terminal phase). COST-MODEL §4.2 records 19 rounds already in
  # exactly that state, holding ~0.16 SOL that no instruction will ever return. Today the population
  # that can reach it is "rounds a real player entered", which is rare. This makes it "every round".
  #
  # WHAT IT COSTS TO RUN: ~0.031 SOL/day while `close_round_account` keeps reclaiming rent, and
  # ~9.96 SOL/day the moment it silently stops — 330x, no exception, no failed transaction, a keeper
  # that looks perfectly healthy throughout. That mechanism has NEVER RUN at MAX_FIGHTERS = 48. The
  # keeper watches for it two ways and stops itself (`GET /reclamation.json`, and the burn brake — see
  # scripts/keeper/README.md, "House-only rounds"), and neither of those is a reason to set this
  # casually; they are what makes it survivable if you do.
  #
  # IT INTERACTS WITH KEEPER_HOLD_OPEN_LOBBY_SECONDS ABOVE. With this on, an empty lobby is drawn at
  # its DEADLINE rather than held — so the seven-day backstop set above would become a seven-day
  # SCHEDULE, i.e. one round a week. The keeper handles that itself: with this mode on it opens
  # DEFAULT_LOBBY_SECONDS lobbies regardless of the backstop, and the authority early close still fires
  # for a real arrival.
  #
  # DEVNET ONLY. Every endpoint the mode will touch — base RPC, router and the ER validator's own fqdn
  # — is re-asserted against the devnet allowlist at boot, naming this feature, and the process refuses
  # to start anywhere else. `fly secrets set KEEPER_HOUSE_ONLY_ROUNDS=1` is the no-deploy way to turn
  # it on for an experiment; unsetting it restores today's behaviour exactly.
  #
  # KEEPER_HOUSE_WALLET_COUNT IS THE ONE THAT IS NOT SELF-SERVICE. Raising it needs new keys generated
  # locally and `KEEPER_HOUSE_WALLETS` re-issued with all of them, in that order; the keeper refuses to
  # boot rather than generating wallets it would fund and then lose on the next restart. See
  # "Raising the wallet count" in scripts/keeper/README.md.

  # KEEPER_CORS_ORIGIN is intentionally NOT set here, and this deployment is not finished until it
  # is. It is a comma-separated list of EXACT browser origins allowed to read /keeper-status.json —
  # the Vercel origin serving the arena, e.g. "https://<project>.vercel.app". Never "*".
  #
  # THE ARGUMENT USED TO REST PARTLY ON DISCLOSURE — "the status file is this keeper's own bot
  # disclosure and its heartbeat" — and that half is simply no longer true: as of
  # `KEEPER_STATUS_SCHEMA` 5 the file carries no house wallets, no disclosure sentence and no split
  # of the fighter count. It does not need that half. What the file still is, on its own, is THIS
  # KEEPER'S LIVENESS AND THE STATE OF THE ROUND IT IS DRIVING: the heartbeat that lets a page tell
  # "next lobby in 0:08" from "the keeper is down", plus the phase, the pot, the fighter count and
  # the clock. A wildcard hands all of that to any page on the internet to poll and re-present as its
  # own — a live mirror of our arena, wearing somebody else's chrome, that we serve and pay for and
  # cannot switch off. That is reason enough by itself, and it is the same reason it always was
  # underneath the disclosure framing: an origin list is about who may EMBED this, not about who may
  # learn a secret. Nothing in the file is confidential; the round is public on chain. What an exact
  # origin list protects is the relationship between this keeper and the one front end it exists to
  # serve.
  # Unset means local-dev origins only, and the keeper logs a loud warning at boot that no
  # production origin is configured — so the failure mode is a page that cannot read the status and
  # a log line saying exactly why, rather than silence. Set it with:
  #   fly secrets set KEEPER_CORS_ORIGIN="https://..."   (or add it here; it is not a secret)

[http_service]
  internal_port = 8080
  force_https = true              # the status file is polled from an https:// page; mixed content
                                  # would be blocked by the browser anyway
  # "off" rather than `false`: both are accepted, but "off"/"stop"/"suspend" is the current spelling
  # and the boolean is the legacy one. Rule 3 — a stopped machine is no arena.
  auto_stop_machines = "off"
  # Rule 1. Fly's own guidance is that autostart and autostop should be enabled or disabled
  # TOGETHER; disabling both is the recommended pairing, and it is what a process that must simply
  # always be running wants. The documented footgun is the other asymmetry (autostop on, autostart
  # off), which stops a machine and never starts it again.
  auto_start_machines = false
  # HONEST LABEL: THIS LINE IS INERT, and it is kept as a statement of intent rather than deleted so
  # nobody adds it back believing it does something. Fly's docs are explicit — `min_machines_running`
  # "has no effect unless you set auto_stop_machines to 'stop' or 'suspend'". It is an autostop FLOOR
  # for the proxy, not a keep-alive and not a scaling control. What actually keeps exactly one machine
  # running is `--ha=false` on every deploy plus never scaling up; see rule 1.
  min_machines_running = 1
  processes = ["app"]

  # Present for backpressure, NOT for scaling. With exactly one machine and autostart off (rule 1),
  # soft_limit can never spill over to a second instance — so the only thing these numbers decide is
  # when Fly's proxy starts queueing. That is still worth setting, because the HTTP server shares a
  # process with the round loop: a flood on a PUBLIC endpoint is a flood competing with the thing
  # that actually opens rounds. Real load is one browser polling every 2s, so 25 is roughly fifty
  # tabs' worth of headroom and 50 is still nowhere near enough concurrency to starve the loop.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

# /health, and note this is the OPPOSITE endpoint from engine/fly.toml, which checks /live and
# deliberately NOT /health. There, /health returns 503 during a solvency freeze and a platform check
# pointed at it would restart-loop the engine through a money incident. Here /health is the safe one
# BY CONSTRUCTION: it does no chain calls and returns 200 with a tiny JSON body for as long as the
# process is answering, precisely so a devnet RPC blip cannot get a healthy keeper killed. The
# divergence between the two files is deliberate in both directions.
#
# This check therefore means "the process is alive", and nothing more. "The keeper is working" is
# keeper.heartbeatAt and keeper.stalledSince in the status file, which the front end already reads —
# and a stalled keeper is one that is catching, backing off and retrying, which a restart does not
# fix, because what is unwell is devnet.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  # 90s, and generous on purpose. The server is now started BEFORE the slow half of boot (see
  # keeper.ts), so this should never be the binding constraint — but what still happens before the
  # loop's first pass is choosing an ER validator, which downloads a ~360KB cloned program account
  # per route and write-probes each with a 5s ceiling, and funding the house bank, which can send a
  # confirmed base-layer transaction. On an unwell devnet that is tens of seconds. Since this check is
  # pure liveness and cannot fail for any reason a restart would fix, a long grace costs nothing and a
  # short one risks killing a machine for being slow to start rather than for being broken.
  grace_period = "90s"
  method = "GET"
  path = "/health"

# ROLLING, STATED EXPLICITLY EVEN THOUGH IT IS THE DEFAULT — because it is the only strategy that
# gives this app both of the things it needs, and because a default is not a decision until it is
# written down. On a single-machine app `rolling` updates that machine IN PLACE (stop, re-image,
# start), so there is never a moment with two keepers, AND it waits for the health check before
# calling the deploy good.
#
# The three rejected, each for a different reason:
#   canary     boots an extra machine alongside the running one to verify it, then destroys it. Two
#              keepers, by design. Fly refuses it only for volume-mounted machines, and this app has
#              no volume (rule 2) — so nothing but this comment stops it being chosen.
#   bluegreen  a parallel machine for every running one. Same objection, larger.
#   immediate  no overlap, but it replaces everything WITHOUT waiting for health checks. That trades
#              away the only automatic signal that a bad image reached production, to buy a property
#              rolling already has here. The wrong side of the trade.
#
# Also do NOT add `[deploy] release_command` or `[[http_service.machine_checks]]`: both run in a
# TEMPORARY machine booted from this image, which for this image means a second process holding the
# arena authority key.
[deploy]
  strategy = "rolling"

# The keeper answers SIGTERM by finishing the current step and stopping; a second one exits
# immediately. Every wait inside a step is interruptible, so ~1s is the typical shutdown. 20 is
# headroom for the worst case (a step blocked on a slow confirmation), not an expectation — and it
# is deliberately short, because the window this bounds is the window in which two keepers could
# both reach for `round_counter + 1`.
#
# An INTEGER of seconds, which is the documented form (default 5, maximum 300). `"20s"` happens to
# parse too, and it is not used: the reference shows the integer, `fly launch` emits the integer, and
# a value that is merely accepted is a value nobody has checked the units of. Fly also calls
# kill_timeout best-effort, so the keeper is built not to need it rather than to rely on it.
kill_signal = "SIGTERM"
kill_timeout = 20

[[vm]]
  size = "shared-cpu-1x"          # one poll loop and a tiny HTTP server; this is not CPU work
  memory = "512mb"                # not for the workload — for Bun plus the web3.js/Anchor object
                                  # graph, which is the same dependency tree the browser app carries
