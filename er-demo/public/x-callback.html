<!--
  WHERE PRIVY SENDS THE X AUTHORISATION POPUP BACK TO.

  This page has NO SCRIPT, and that is the point of it. `src/v2/data/xPrivy.ts` opens a popup onto
  this file, navigates it to Privy, and then watches it: once the window comes back to this origin
  carrying `privy_oauth_code`, the OPENER reads those two query parameters off `popup.location` and
  closes the window. Nothing has to run here for that to work.

  A `postMessage` version of this page was considered and rejected — the reasoning is written out in
  `xPrivy.ts`'s "REJECTED ALTERNATIVES", and the short form is that the opener has to poll
  `popup.closed` anyway to notice a player closing the window, so a second completion channel would
  only be a race with its own origin check to get wrong.

  It lives in `public/` rather than being an entry in `vite.config.ts` so that Vite copies it verbatim
  and it never touches the chunk graph. It is not part of any bundle and costs nobody who does not
  complete an X authorisation anything at all.

  THE AUTHORISATION CODE IN THE URL IS NOT A CREDENTIAL ON ITS OWN. It is single-use and worthless
  without the PKCE verifier, which never leaves the opener's storage.

  The wording covers both moments this window is visible: the instant before X loads, and the instant
  after it returns. In both, closing the window is a safe thing to do and says so.
-->
