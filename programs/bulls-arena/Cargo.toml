[package]
name = "bulls-arena"
version = "0.1.0"
description = "Bulls vs Unicorns — on-chain round state, executed on a MagicBlock Ephemeral Rollup (DEVNET ONLY)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bulls_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# bench_fight is a CU-measurement probe (ER-030), not gameplay — it costs nothing to keep in the
# workspace but nothing to ship either, and this program is unusually size-constrained (devnet rent
# scales with binary bytes against a faucet-limited payer — see MAX_FIGHTERS's doc comment). Off by
# default; enable explicitly to run `er-cu-bench.mjs` against a fresh build.
bench = []

[dependencies]
# SEC/CORRECTNESS finding (this session, Phase 6): pinned EXACT, not "^1.0.2" (Cargo's default caret
# range). The unpinned range let Cargo silently resolve anchor-lang 1.1.2 — a version that migrated
# anchor-syn's whole attribute/constraint parser from syn 1.x to syn 2.0 (see anchor's own
# CHANGELOG.md, [1.1.1]: "lang: Migrate anchor-syn from syn 1.x to syn 2.0"). That migration broke
# `#[derive(Accounts, Session)]` + `#[session(signer = signer, authority = player.key())]` in a way
# that never surfaces as a compile error: the deployed program rejected every session-signed enter()/
# extract() with "AnchorError caused by account: player. Error Code: AccountNotSigner" — a real
# devnet failure discovered by this session's own Phase 6 verification, not a hypothetical — even
# though `cargo expand`'s own output, read line-by-line, shows no code path that could produce that
# error for an `UncheckedAccount` field. Every toolchain file in this repo (every Anchor.toml's
# `anchor_version`, the installed `anchor-cli 1.0.2`, Phase 0's own spike) was built and verified
# against 1.0.2 specifically; the caret range was silent drift this program never actually asked
# for. Exact-pinning here is a reproducibility fix, not a version downgrade choice made for its own
# sake — re-verified clean (native test + on-chain session-signed enter/extract, both directions)
# after this change; see MEGA_QUEUE.md/MAGICBLOCK_FEEDBACK.md for the full trail.
anchor-lang = "=1.0.2"   # init-if-needed was declared but never used; it costs bytes
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
# anchor 1.x no longer re-exports solana_program::hash — the ecosystem moved to split crates, so the
# sha256 syscall wrapper is its own dependency now. Verified by reading anchor-lang 1.0.2's
# re-export list rather than guessing at the path a second time.
solana-sha256-hasher = "3.1.0"
# Session Keys (Phase 6, snug-floating-mitten.md) — proven combined with ER delegation first in
# programs/bulls-arena-session-spike (Phase 0, commit e3fb149) before landing on the real program.
# `no-entrypoint` is required, not optional: without it the crate's own `#[global_allocator]`
# collides with ours at compile time ("the #[global_allocator] in this crate conflicts with global
# allocator in: session_keys") — documented in the crate's install snippet, found here the hard way
# in Phase 0, see MAGICBLOCK_FEEDBACK.md's entry on it.
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
# Required by `#[account(zero_copy)]`, and required HERE rather than inherited. The macro expands to
# `#[derive(::bytemuck::Pod)]` — an absolute path, resolved in THIS crate's dependency graph — so
# anchor-lang having bytemuck is not enough and the omission is a compile error, not a subtle one.
# `derive` is the feature that carries the Pod/Zeroable derives. Already in the lockfile transitively
# (solana-address pulls the same 1.25.2), so this adds no download and no second version.
bytemuck = { version = "1", features = ["derive"] }
# THE ROUND'S SHAPE AND ITS BOOKS, WHICH THIS PROGRAM NO LONGER OWNS ALONE. `Round`, `Fighter`,
# `Phase`, `MAX_FIGHTERS`, the four book-keeping functions and the offsets test moved out to
# `crates/arena-state` so that `programs/arena-vault` can check solvency with THIS code rather than a
# second copy of it (ARENA-VAULT.md §3.4, and the comment above `Round::players_hold`). Read that
# crate's header before adding anything to it — in particular, it must never learn a program id, and
# `declare_id!` stays in this file.
arena-state = { path = "../../crates/arena-state" }

[dev-dependencies]
# The same crate again, with `test-support`, and this is the standard way to add a feature for test
# builds only. It carries two things this program's tests need and its binary must not: `Debug`/
# `PartialEq` on `Fighter` (`ticking_in_chunks_is_identical_to_one_shot` compares two whole
# `[Fighter; 48]`s) and the shared body of the account-offsets assertion, which
# `the_account_layout_is_exactly_what_the_clients_decode` calls so that the check still runs under
# THIS package's own `cargo test`. Resolver 2 does NOT unify dev-dependency features into a normal
# build, so `cargo build-sbf` gets the crate without either — which is why this line costs the
# deployed binary nothing.
arena-state = { path = "../../crates/arena-state", features = ["test-support"] }
# The compute gate (`tests/compute.rs`). LiteSVM runs the COMPILED SBF binary against real account
# bytes in-process and reports `compute_units_consumed`, which is the only way to measure the real
# instructions off-chain: `bench_fight` can only measure the loop, and reaching `Phase::Fight`
# legitimately needs the VRF oracle. Building a round's bytes directly sidesteps both.
#
# 0.11 SPECIFICALLY, and the reason is type identity rather than features. litesvm 0.7 is built on
# the solana 2.x crate family, so its `Pubkey` is a DIFFERENT TYPE from the `solana-pubkey` 3.0.0 that
# anchor-lang 1.0.2 pulls in — every address would have to be round-tripped through `to_bytes()` at
# the boundary, which is exactly the kind of conversion that silently measures the wrong account.
# 0.11 is on solana 3.x and the types unify.
litesvm = "0.11"
solana-account = "3"
solana-pubkey = "3"
solana-sdk-ids = "3"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-signer = "3"
solana-transaction = "3"

# CARGO IGNORES THIS BLOCK, AND ANCHOR REQUIRES IT. Both halves are true and that is the point.
#
# `[profile.*]` is only honoured in a workspace ROOT manifest, so cargo emits "profiles for the non
# root package will be ignored" and builds using the root Cargo.toml's profile — which is where the
# real setting lives, alongside lto/codegen-units/opt-level, and where it must stay.
#
# But `anchor build` (1.0.2, the otter-sec fork that `avm install 1.0.2` resolves to) refuses to
# build without seeing it HERE, and its error names the wrong file:
#
#     Error: `overflow-checks` is not enabled. To enable, add:
#     [profile.release]
#     overflow-checks = true
#     in workspace root Cargo.toml
#
# The root Cargo.toml had it on line 30 the entire time. Proven by elimination inside the pinned
# container: `cargo metadata` reported workspace_root as the repo root, that root manifest had the
# setting as the first entry under [profile.release], and anchor still refused — until this block was
# added here, at which point it built. The host's anchor 1.0.2 does not enforce it, which is why this
# only ever appeared in Docker.
#
# So: duplicated deliberately, not by accident. If it is ever removed as redundant, `docker compose
# run --rm program-build` starts failing with an error that points at a file which is already correct.
[profile.release]
overflow-checks = true
